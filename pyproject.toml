[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-to-image"
version = "1.0.0"
description = "Convert text/markdown files to PNG images for context comprehension"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Zim", email = "zim@aibud.onmicrosoft.com"}
]

dependencies = [
    "Pillow>=12.0.0",
    "importlib-resources>=6.0.0; python_version < '3.9'",
]

[project.urls]
Homepage = "https://github.com/company/prompt-to-image"
Repository = "https://github.com/company/prompt-to-image.git"

[project.scripts]
prompt-to-image = "prompt_to_image.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_to_image = ["fonts/*.ttf"]
